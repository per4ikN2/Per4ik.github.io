 <!DOCTYPE html>

<head>

<body>

    <button class = "btn" onclick = "window.location.href = 'https://discord.com/users/1241448972695113821'">Discord</button>
    <button class = "btn2" onclick = "window.location.href = 'https://t.me/per4ikN2'">Telegram</button>
    <button class = "btn3" onclick = "window.location.href = 'https://t.me/ArbusStodio'">Telegram канал</button>
</body>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0c10;
            --text-primary: #f5f7fb;
            --text-secondary: #8b95a8;
            --accent-purple: #b794f4;
            --accent-violet: #9d7aff;
            --gradient-main: linear-gradient(135deg, #b794f4 0%, #9d7aff 50%, #818cf8 100%);
            --gradient-discord: linear-gradient(135deg, #5865f2 0%, #7c3aed 100%);
            --gradient-telegram: linear-gradient(135deg, #2aabee 0%, #229ed9 100%);
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --radius-md: 1rem;
            --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse at 15% 20%, rgba(183, 148, 244, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 75%, rgba(96, 165, 250, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(157, 122, 255, 0.04) 0%, transparent 70%);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(183, 148, 244, 0.2) 0%, transparent 70%);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.15) 0%, transparent 70%);
            bottom: -150px;
            left: -150px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }


        h1.menu-card {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-align: center;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 0.6s ease both;
            position: relative;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 420px;
        }


        h1.menu-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            border-radius: 3px;
            background: var(--gradient-main);
            box-shadow: 0 0 20px rgba(183, 148, 244, 0.6);
        }


        .btn,
        .btn2,
        .btn3 {
            width: 100%;
            max-width: 420px;
            padding: 1.15rem 1.75rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.6s ease both;
        }


        .btn::before,
        .btn2::before,
        .btn3::before {
            font-family: 'Font Awesome 6 Brands';
            font-size: 1.3rem;
            font-weight: 400;
            transition: var(--transition);
        }

        .btn::before {
            content: '\f392'; 
        }

        .btn2::before {
            content: '\f2c6';
        }

        .btn3::before {
            content: '\f2c6';
        }


        .btn::after,
        .btn2::after,
        .btn3::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .btn:hover::after,
        .btn2:hover::after,
        .btn3:hover::after {
            left: 100%;
        }

        .btn:hover,
        .btn2:hover,
        .btn3:hover {
            transform: translateY(-3px) scale(1.01);
        }

        .btn:hover::before,
        .btn2:hover::before,
        .btn3:hover::before {
            transform: scale(1.2);
        }

        .btn:active,
        .btn2:active,
        .btn3:active {
            transform: translateY(-1px) scale(0.99);
        }


        .btn {
            background: var(--gradient-discord);
            box-shadow: 0 10px 30px -8px rgba(88, 101, 242, 0.5);
            animation-delay: 0.1s;
        }

        .btn:hover {
            box-shadow: 0 15px 40px -8px rgba(88, 101, 242, 0.7);
        }


        .btn2, .btn3 {
            background: var(--gradient-telegram);
            box-shadow: 0 10px 30px -8px rgba(42, 171, 238, 0.5);
            animation-delay: 0.2s;
        }

        .btn2, .btn3 :hover {
            box-shadow: 0 15px 40px -8px rgba(42, 171, 238, 0.7);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 440px) {
            h1.menu-card {
                font-size: 1.5rem;
            }
            .btn, .btn2, .btn3 {
                padding: 1rem 1.25rem;
                font-size: 1rem;
            }
        }


        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
